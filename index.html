<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141A">
<title>여행 영상함</title>
<style>
  :root {
    --bg: #10141A;
    --panel: #181E27;
    --panel-2: #202836;
    --ink: #F1EFEA;
    --muted: #8A93A5;
    --line: #2A3342;
    --accent: #FF7E5F;
    --accent-deep: #E2593A;
    --danger: #FF6B6B;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(255, 126, 95, .10) 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 30px 18px calc(44px + env(safe-area-inset-bottom));
  }

  header { margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { font-size: 24px; }
  h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #count { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* 링크 추가 바 */
  #addBar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  #linkInput {
    flex: 1;
    height: 50px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 0 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    min-width: 0;
  }
  #linkInput:focus { border-color: var(--accent-deep); }
  #linkInput::placeholder { color: #4E576A; }
  #addBtn {
    height: 50px;
    padding: 0 22px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #1C0F0A;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    flex: none;
  }
  #addBtn:active { background: var(--accent-deep); }
  #addBtn:disabled { opacity: .5; cursor: default; }
  #addMsg { font-size: 13px; color: var(--danger); margin: 0 0 12px 4px; display: none; }

  .tools { display: flex; gap: 8px; margin-bottom: 12px; }

  /* 필터 칩 */
  #filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }
  #filters:empty { display: none; }
  .chip {
    height: 32px;
    padding: 0 13px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: border-color .1s, color .1s;
  }
  .chip:hover { color: var(--ink); border-color: #38445A; }
  .chip.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #1C0F0A;
    font-weight: 700;
  }
  .chip.year { border-style: dashed; }
  .chip.year.on { border-style: solid; }
  #search {
    flex: 1;
    height: 42px;
    border-radius: 21px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 0 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    min-width: 0;
  }
  #search:focus { border-color: var(--accent-deep); }
  #search::placeholder { color: #4E576A; }
  #sortBtn {
    height: 42px;
    padding: 0 14px;
    border-radius: 21px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    flex: none;
  }

  /* 카드 그리드 */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: #38445A; }
  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #0A0D12;
    cursor: pointer;
    border: none;
    padding: 0;
    display: block;
    width: 100%;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 16, .25);
    transition: background .12s;
  }
  .thumb:hover .play { background: rgba(10, 12, 16, .05); }
  .thumb .play span {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(16, 20, 26, .8);
    border: 1.5px solid rgba(255, 255, 255, .55);
    color: #fff;
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 4px;
  }
  .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* 퀴즈로 잠긴 카드 */
  .thumb.locked img { filter: blur(14px) saturate(.5) brightness(.55); transform: scale(1.1); }
  .thumb.locked .play { background: rgba(10, 12, 16, .45); }
  .thumb.locked .play span {
    border-color: rgba(255, 255, 255, .4);
    padding-left: 0;
    font-size: 20px;
  }
  .lockTag {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(10, 12, 16, .8);
    border: 1px solid rgba(255, 255, 255, .18);
    color: #FFD9CC;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .solvedTag {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(10, 12, 16, .7);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
  }

  /* 퀴즈 모달 */
  #quizOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 11, .86);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
    padding: 20px;
  }
  #quizOverlay.on { display: flex; }
  #quizBox {
    width: 100%;
    max-width: 460px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px 22px;
  }
  #quizBox.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  #quizBox .qmark { font-size: 26px; }
  #quizVideoTitle { font-size: 12.5px; color: var(--muted); margin: 8px 0 2px; }
  #quizQ { font-size: 18px; font-weight: 800; line-height: 1.5; margin: 4px 0 16px; letter-spacing: -0.01em; }
  #quizA {
    width: 100%;
    height: 52px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 0 16px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  #quizA:focus { border-color: var(--accent); }
  #quizMsg { font-size: 13px; margin: 10px 2px 0; min-height: 18px; line-height: 1.5; }
  #quizMsg.bad { color: var(--danger); }
  #quizMsg.hint { color: var(--accent); }
  #quizBox .btns { display: flex; gap: 10px; margin-top: 16px; }
  #quizBox .btns button {
    height: 50px;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    flex: none;
    padding: 0 16px;
  }
  #quizBox .btns #qSubmit {
    flex: 1;
    background: var(--accent);
    border-color: var(--accent);
    color: #1C0F0A;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .place {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .title {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: -0.01em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .memo {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 6px;
  }
  .date { font-size: 11.5px; color: #57617A; font-variant-numeric: tabular-nums; }
  .foot .acts { display: flex; gap: 2px; }
  .foot button {
    background: none;
    border: none;
    color: #57617A;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-family: inherit;
  }
  .foot button:hover { color: var(--ink); background: var(--panel-2); }

  #empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14.5px;
    line-height: 1.8;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  #empty b { color: var(--ink); }

  /* 재생 모달 */
  #playerOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 11, .92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  #playerOverlay.on { display: flex; }
  #playerBox {
    width: 100%;
    max-width: 900px;
  }
  #playerBox .frame {
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  #playerBox iframe { width: 100%; height: 100%; border: 0; display: block; }
  #playerBox .pmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }
  #pTitle { font-size: 15px; font-weight: 700; }
  #playerBox .pmeta .btns { display: flex; gap: 8px; flex: none; }
  #playerBox .pmeta button, #playerBox .pmeta a {
    height: 40px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  /* 수정 모달 */
  #editOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 11, .75);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  #editOverlay.on { display: flex; }
  #sheet {
    width: 100%;
    max-width: 540px;
    background: var(--panel-2);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  @media (min-width: 580px) {
    #editOverlay { align-items: center; }
    #sheet { border-radius: 20px; }
  }
  #sheet h2 { margin: 0; font-size: 17px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input {
    height: 46px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .field input:focus { border-color: var(--accent-deep); }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  #sheet .btns { display: flex; gap: 10px; margin-top: 4px; }
  #sheet .btns button {
    flex: 1;
    height: 50px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
  }
  #sheet .btns .save {
    background: var(--accent);
    border-color: var(--accent);
    color: #1C0F0A;
  }
  .quizFields {
    border-top: 1px solid var(--line);
    padding-top: 13px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #eQNote { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

  footer {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  footer button {
    background: none;
    border: none;
    color: #4E576A;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  footer button:hover { color: var(--muted); }

  /* 관리자 */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #adminBtn {
    flex: none;
    height: 34px;
    padding: 0 13px;
    border-radius: 17px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  #adminBtn:hover { color: var(--ink); border-color: #38445A; }
  body.admin #adminBtn {
    color: var(--accent);
    border-color: var(--accent-deep);
    background: rgba(255, 126, 95, .08);
  }
  /* 관리자 전용 UI — 기본은 숨김 */
  #addBar, #addMsg, #syncBanner, .adminOnly { display: none !important; }
  body.admin #addBar { display: flex !important; }
  body.admin .adminOnly { display: inline-flex !important; }
  body.admin #syncBanner.show { display: block !important; }

  /* 숨김 처리된 영상 (관리자에게만 보임) */
  .card.hidden { opacity: .55; border-style: dashed; }
  .card.hidden .thumb img { filter: grayscale(.7); }
  .hiddenTag {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(10, 12, 16, .82);
    border: 1px solid rgba(255, 255, 255, .18);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
  }

  /* 로그인 모달 */
  #loginOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 11, .86);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #loginOverlay.on { display: flex; }
  #loginBox {
    width: 100%;
    max-width: 380px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #loginBox h2 { margin: 0 0 2px; font-size: 17px; }
  #loginBox input {
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 0 15px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  #loginBox input:focus { border-color: var(--accent-deep); }
  #loginMsg { font-size: 13px; color: var(--danger); min-height: 17px; margin: 0; }
  #loginBox .btns { display: flex; gap: 10px; margin-top: 2px; }
  #loginBox .btns button {
    flex: 1;
    height: 48px;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
  }
  #loginBox .btns .go {
    background: var(--accent);
    border-color: var(--accent);
    color: #1C0F0A;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .thumb .play { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">🧳</span>
      <div>
        <h1>여행 영상함</h1>
        <p class="sub"><span id="subMsg">여행 기록 영상 모음</span> · <span id="count">0</span>편</p>
      </div>
    </div>
    <button id="adminBtn" type="button" title="관리자 로그인">🔑 <span id="adminLabel">관리자</span></button>
  </header>

  <div id="addBar">
    <input id="linkInput" type="url" placeholder="유튜브 링크 붙여넣기 (youtube.com / youtu.be)" inputmode="url" autocapitalize="off" autocomplete="off">
    <button id="addBtn">추가</button>
  </div>
  <p id="addMsg"></p>

  <div class="tools">
    <input id="search" type="search" placeholder="제목·여행지·메모 검색" autocomplete="off">
    <button id="sortBtn" title="정렬 바꾸기">최신순</button>
  </div>

  <div id="filters"></div>

  <div id="syncBanner" style="margin-bottom:14px; padding:13px 15px; border:1px solid var(--accent-deep); border-radius:var(--radius); background:rgba(255,126,95,.07); font-size:13px; line-height:1.6;">
    <b>이 기기에만 저장된 변경 <span id="syncCount">0</span>건</b>이 있습니다. (새로 추가한 영상, 수정한 정보, 퀴즈, 숨김 설정 등)<br>
    모든 기기·모든 사람에게 반영하려면 아래 버튼으로 목록 코드를 복사해 저장해 두세요.
    <div style="margin-top:8px;">
      <button id="syncCopy" style="height:36px; padding:0 16px; border-radius:10px; border:none; background:var(--accent); color:#1C0F0A; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;">목록 코드 복사</button>
      <span id="syncMsg" style="color:var(--muted); margin-left:8px;"></span>
    </div>
  </div>

  <div id="grid" role="list"></div>

  <footer>
    <button id="exportBtn" class="adminOnly">백업 내보내기</button>
    <button id="importBtn" class="adminOnly">가져오기</button>
    <button id="relockBtn">퀴즈 다시 잠그기</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </footer>
</div>

<div id="playerOverlay">
  <div id="playerBox">
    <div class="frame"><iframe id="playerFrame" src="about:blank" title="영상 재생" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="pmeta">
      <div id="pTitle"></div>
      <div class="btns">
        <a id="pYoutube" href="#" target="_blank" rel="noopener">유튜브에서 열기</a>
        <button id="pClose">닫기</button>
      </div>
    </div>
  </div>
</div>

<div id="loginOverlay">
  <div id="loginBox" role="dialog" aria-modal="true">
    <h2>🔑 관리자 로그인</h2>
    <input id="loginId" placeholder="아이디" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <p id="loginMsg"></p>
    <div class="btns">
      <button type="button" class="go" id="loginGo">로그인</button>
      <button type="button" id="loginCancel">취소</button>
    </div>
  </div>
</div>

<div id="quizOverlay">
  <div id="quizBox" role="dialog" aria-modal="true">
    <div class="qmark">🔒</div>
    <div id="quizVideoTitle"></div>
    <div id="quizQ"></div>
    <input id="quizA" placeholder="정답 입력" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="quizMsg"></div>
    <div class="btns">
      <button type="button" id="qSubmit">확인</button>
      <button type="button" id="qHint">힌트</button>
      <button type="button" id="qCancel">닫기</button>
    </div>
  </div>
</div>

<div id="editOverlay">
  <div id="sheet" role="dialog" aria-modal="true">
    <h2>영상 정보 수정</h2>
    <div class="field">
      <label for="eTitle">제목</label>
      <input id="eTitle">
    </div>
    <div class="row">
      <div class="field">
        <label for="ePlace">여행지</label>
        <input id="ePlace" placeholder="예: 제주도, 오사카">
      </div>
      <div class="field">
        <label for="eDate">여행 날짜</label>
        <input id="eDate" type="date">
      </div>
    </div>
    <div class="field">
      <label for="eMemo">메모</label>
      <input id="eMemo" placeholder="같이 간 사람, 기억나는 순간…">
    </div>

    <div class="quizFields">
      <div class="field">
        <label for="eQ">🔒 재생 전 질문 <span style="text-transform:none;letter-spacing:0">(비워두면 잠금 없음)</span></label>
        <input id="eQ" placeholder="예: 이날 우리가 먹은 야식은?">
      </div>
      <div class="row">
        <div class="field">
          <label for="eA">정답 <span style="text-transform:none;letter-spacing:0">(쉼표로 여러 개)</span></label>
          <input id="eA" placeholder="예: 마라탕, 마라샹궈">
        </div>
        <div class="field">
          <label for="eHint">힌트</label>
          <input id="eHint" placeholder="선택 입력">
        </div>
      </div>
      <p id="eQNote">정답은 암호화(해시)되어 저장돼서 페이지 소스에 그대로 보이지 않습니다. 띄어쓰기·대소문자는 무시하고 채점합니다.</p>
    </div>

    <div class="btns">
      <button type="button" id="eCancel">취소</button>
      <button type="button" class="save" id="eSave">저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "travel.videos.v1";

  var DELKEY = "travel.videos.deleted.v1";
  var PASSKEY = "travel.videos.passed.v1";
  var ADMINKEY = "travel.admin.v1";

  // ---------- 관리자 ----------
  // 아이디:비밀번호의 SHA-256 해시만 보관한다 (소스에 평문이 남지 않게).
  var ADMIN_HASH = "6b96aa0dcd27ed746cf9e20aa084cccd54c46ed22373521f0fdd58b253644c9e";
  var isAdmin = false;
  try { isAdmin = localStorage.getItem(ADMINKEY) === ADMIN_HASH; } catch (e) {}

  function applyAdminUI() {
    document.body.classList.toggle("admin", isAdmin);
    $("adminLabel").textContent = isAdmin ? "관리자 ✓" : "관리자";
    $("adminBtn").title = isAdmin ? "로그아웃" : "관리자 로그인";
    $("subMsg").textContent = isAdmin ? "관리자 모드 — 추가·수정·숨김 가능" : "여행 기록 영상 모음";
  }

  function openLogin() {
    $("loginId").value = "";
    $("loginPw").value = "";
    $("loginMsg").textContent = "";
    $("loginOverlay").classList.add("on");
    setTimeout(function () { $("loginId").focus(); }, 50);
  }
  function closeLogin() { $("loginOverlay").classList.remove("on"); }

  function tryLogin() {
    var id = $("loginId").value.trim();
    var pw = $("loginPw").value;
    if (!id || !pw) { $("loginMsg").textContent = "아이디와 비밀번호를 입력하세요."; return; }
    if (!(window.crypto && crypto.subtle)) {
      $("loginMsg").textContent = "이 환경에서는 로그인할 수 없습니다 (https 주소로 접속해 주세요).";
      return;
    }
    sha256Hex(id + ":" + pw).then(function (h) {
      if (h === ADMIN_HASH) {
        isAdmin = true;
        try { localStorage.setItem(ADMINKEY, ADMIN_HASH); } catch (e) {}
        applyAdminUI(); closeLogin(); render(); checkSync();
      } else {
        $("loginMsg").textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
        $("loginPw").select();
      }
    });
  }

  $("adminBtn").addEventListener("click", function () {
    if (!isAdmin) { openLogin(); return; }
    if (confirm("관리자 모드를 끌까요?")) {
      isAdmin = false;
      try { localStorage.removeItem(ADMINKEY); } catch (e) {}
      applyAdminUI(); render(); checkSync();
    }
  });
  $("loginGo").addEventListener("click", tryLogin);
  $("loginPw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
  $("loginId").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginPw").focus(); });
  $("loginCancel").addEventListener("click", closeLogin);
  $("loginOverlay").addEventListener("click", function (e) { if (e.target === this) closeLogin(); });

  // ---------- 퀴즈 잠금 ----------
  // 정답은 해시로만 저장한다(소스에 평문이 남지 않게).
  function normAnswer(s) {
    return String(s || "")
      .normalize("NFC")
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[.,!?~·・"'’”…\-_/\\()[\]{}]/g, "");
  }

  function sha256Hex(str) {
    if (window.crypto && crypto.subtle) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))
        .then(function (buf) {
          return Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return b.toString(16).padStart(2, "0");
          }).join("");
        });
    }
    // http:// 등 보안 컨텍스트가 아니면 해시 불가 → 평문 비교로 폴백
    return Promise.resolve("plain:" + str);
  }

  function hashAnswers(csv) {
    var list = String(csv || "").split(",").map(normAnswer).filter(Boolean);
    return Promise.all(list.map(sha256Hex));
  }

  var passed = [];
  try {
    var pv = JSON.parse(localStorage.getItem(PASSKEY));
    if (Array.isArray(pv)) passed = pv;
  } catch (e) {}
  function savePassed() {
    try { localStorage.setItem(PASSKEY, JSON.stringify(passed)); } catch (e) {}
  }
  function hasQuiz(v) { return !!(v.q && ((v.aHash && v.aHash.length) || v.a)); }
  function isLocked(v) { return hasQuiz(v) && passed.indexOf(v.id) < 0; }

  // 공용 목록(videos.json, 저장소에 커밋됨) + 이 브라우저의 변경분(localStorage)을 합쳐서 보여줌
  var sharedList = [];   // videos.json 원본
  var videos = [];       // 화면에 쓰는 병합 목록

  function loadLocal(key) {
    try {
      var v = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(v)) return v;
    } catch (e) {}
    return [];
  }

  function mergeLists() {
    var overlay = loadLocal(KEY);
    var deleted = loadLocal(DELKEY);
    var byId = {};
    overlay.forEach(function (v) { if (v && v.id) byId[v.id] = v; });
    videos = [];
    sharedList.forEach(function (s) {
      if (deleted.indexOf(s.id) >= 0) return;
      // 공용 항목은 복사본을 넣는다. 원본을 그대로 넣으면 수정 시 sharedList까지
      // 같이 바뀌어 "변경 없음"으로 판정되고 저장이 되지 않는다.
      videos.push(byId[s.id] || JSON.parse(JSON.stringify(s)));
      delete byId[s.id];
    });
    overlay.forEach(function (v) {
      if (v && v.id && byId[v.id]) videos.push(v);
    });
  }

  function save() {
    try {
      var sharedJson = {};
      sharedList.forEach(function (s) { sharedJson[s.id] = JSON.stringify(s); });
      // 공용 목록과 다른 항목(수정본·새 항목)만 이 브라우저에 저장
      var overlay = videos.filter(function (v) { return sharedJson[v.id] !== JSON.stringify(v); });
      // 공용 목록에 있지만 화면 목록에서 지운 것 = 이 브라우저에서의 삭제
      var deleted = sharedList.filter(function (s) {
        return !videos.some(function (v) { return v.id === s.id; });
      }).map(function (s) { return s.id; });
      localStorage.setItem(KEY, JSON.stringify(overlay));
      localStorage.setItem(DELKEY, JSON.stringify(deleted));
    } catch (e) {}
    checkSync();
  }

  function parseId(url) {
    var m = url.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  var sortNewest = true;
  var filterPlace = "";
  var filterYear = "";

  function yearOf(v) {
    var d = v.tripDate || v.added || "";
    return d.slice(0, 4);
  }

  // 숨김 영상은 관리자에게만 보인다
  function visibleVideos() {
    return isAdmin ? videos : videos.filter(function (v) { return !v.hidden; });
  }

  function buildFilters() {
    var box = $("filters");
    box.innerHTML = "";
    var places = [], years = [];
    visibleVideos().forEach(function (v) {
      if (v.place && places.indexOf(v.place) < 0) places.push(v.place);
      var y = yearOf(v);
      if (y && years.indexOf(y) < 0) years.push(y);
    });
    places.sort();
    years.sort().reverse();
    if (places.length < 2 && years.length < 2) return; // 필터할 게 없으면 숨김

    function chip(label, cls, on, fn) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cls ? " " + cls : "") + (on ? " on" : "");
      b.textContent = label;
      b.addEventListener("click", fn);
      box.appendChild(b);
    }
    chip("전체", "", !filterPlace && !filterYear, function () {
      filterPlace = ""; filterYear = ""; render();
    });
    places.forEach(function (p) {
      chip("📍 " + p, "", filterPlace === p, function () {
        filterPlace = filterPlace === p ? "" : p; render();
      });
    });
    years.forEach(function (y) {
      chip(y, "year", filterYear === y, function () {
        filterYear = filterYear === y ? "" : y; render();
      });
    });
  }

  function msg(t) {
    var el = $("addMsg");
    el.textContent = t || "";
    el.style.display = t ? "block" : "none";
  }

  function render() {
    var q = $("search").value.trim().toLowerCase();
    var grid = $("grid");
    grid.innerHTML = "";
    var pool = visibleVideos();
    var hiddenCount = videos.filter(function (v) { return v.hidden; }).length;
    $("count").textContent = pool.length + (isAdmin && hiddenCount ? " · 숨김 " + hiddenCount : "");
    buildFilters();

    var list = pool.slice().sort(function (a, b) {
      var ka = a.tripDate || a.added || "";
      var kb = b.tripDate || b.added || "";
      return sortNewest ? (ka < kb ? 1 : -1) : (ka > kb ? 1 : -1);
    });

    var shown = 0;
    list.forEach(function (v) {
      if (q && (v.title + " " + (v.place || "") + " " + (v.memo || "")).toLowerCase().indexOf(q) < 0) return;
      if (filterPlace && v.place !== filterPlace) return;
      if (filterYear && yearOf(v) !== filterYear) return;
      shown++;
      var idx = videos.indexOf(v);

      var card = document.createElement("div");
      card.className = "card" + (v.hidden ? " hidden" : "");
      card.setAttribute("role", "listitem");

      var locked = isLocked(v);
      var th = document.createElement("button");
      th.className = "thumb" + (locked ? " locked" : "");
      th.type = "button";
      th.setAttribute("aria-label", v.title + (locked ? " — 잠김, 질문에 답하면 재생" : " 재생"));
      var img = document.createElement("img");
      img.src = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";
      img.alt = "";
      img.loading = "lazy";
      th.appendChild(img);
      var pl = document.createElement("div");
      pl.className = "play";
      pl.innerHTML = locked ? "<span>🔒</span>" : "<span>▶</span>";
      th.appendChild(pl);
      if (hasQuiz(v)) {
        var tag = document.createElement("span");
        tag.className = locked ? "lockTag" : "solvedTag";
        tag.textContent = locked ? "🔒 퀴즈" : "✓ 열림";
        th.appendChild(tag);
      }
      if (v.hidden) {
        var ht = document.createElement("span");
        ht.className = "hiddenTag";
        ht.textContent = "🙈 숨김";
        th.appendChild(ht);
      }
      th.addEventListener("click", function () {
        if (isLocked(v)) openQuiz(v); else openPlayer(v);
      });

      var body = document.createElement("div");
      body.className = "body";
      if (v.place) {
        var p = document.createElement("span");
        p.className = "place";
        p.textContent = "📍 " + v.place;
        body.appendChild(p);
      }
      var t = document.createElement("div");
      t.className = "title";
      t.textContent = v.title;
      body.appendChild(t);
      if (v.memo) {
        var mm = document.createElement("div");
        mm.className = "memo";
        mm.textContent = v.memo;
        body.appendChild(mm);
      }

      var foot = document.createElement("div");
      foot.className = "foot";
      var dt = document.createElement("span");
      dt.className = "date";
      dt.textContent = v.tripDate ? v.tripDate.replace(/-/g, ".") : "";
      foot.appendChild(dt);
      if (isAdmin) {
        var acts = document.createElement("div");
        acts.className = "acts";
        var eb = document.createElement("button");
        eb.textContent = "수정";
        eb.addEventListener("click", function () { openEdit(idx); });
        var hb = document.createElement("button");
        hb.textContent = v.hidden ? "보이기" : "숨기기";
        hb.title = v.hidden ? "다시 모두에게 보이게" : "일반 사용자에게 안 보이게";
        hb.addEventListener("click", function () {
          if (v.hidden) delete v.hidden; else v.hidden = true;
          save(); render();
        });
        var db = document.createElement("button");
        db.textContent = "삭제";
        db.addEventListener("click", function () {
          if (confirm('"' + v.title + '" 카드를 삭제할까요?')) {
            videos.splice(idx, 1); save(); render();
          }
        });
        acts.appendChild(eb);
        acts.appendChild(hb);
        acts.appendChild(db);
        foot.appendChild(acts);
      }
      body.appendChild(foot);

      card.appendChild(th);
      card.appendChild(body);
      grid.appendChild(card);
    });

    if (shown === 0) {
      var em = document.createElement("div");
      em.id = "empty";
      em.innerHTML = (q || filterPlace || filterYear)
        ? "조건에 맞는 영상이 없습니다."
        : (isAdmin
          ? "아직 보관한 영상이 없습니다.<br>위에 <b>유튜브 링크를 붙여넣고 추가</b>를 눌러보세요.<br>제목과 썸네일은 자동으로 가져옵니다."
          : "아직 공개된 영상이 없습니다.");
      grid.appendChild(em);
    }
  }

  // ---------- 추가 ----------
  function addVideo() {
    var url = $("linkInput").value.trim();
    if (!url) return;
    var id = parseId(url);
    if (!id) { msg("유튜브 링크가 아닌 것 같습니다. youtube.com 또는 youtu.be 주소를 붙여넣어 주세요."); return; }
    if (videos.some(function (v) { return v.id === id; })) { msg("이미 보관함에 있는 영상입니다."); return; }
    msg("");
    $("addBtn").disabled = true;
    $("addBtn").textContent = "가져오는 중…";

    var item = {
      id: id,
      title: "제목 불러오는 중…",
      place: "", memo: "", tripDate: "",
      added: new Date().toISOString().slice(0, 10)
    };

    fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
      .then(function (r) { return r.json(); })
      .then(function (d) { item.title = d.title || "제목 없음 (직접 입력)"; })
      .catch(function () { item.title = "제목 없음 (직접 입력)"; })
      .then(function () {
        videos.push(item);
        save();
        $("linkInput").value = "";
        $("addBtn").disabled = false;
        $("addBtn").textContent = "추가";
        render();
        openEdit(videos.length - 1); // 바로 여행지·날짜 입력
      });
  }
  $("addBtn").addEventListener("click", addVideo);
  $("linkInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addVideo(); });

  // ---------- 퀴즈 ----------
  var quizVideo = null, tries = 0;

  function openQuiz(v) {
    quizVideo = v;
    tries = 0;
    $("quizVideoTitle").textContent = v.title;
    $("quizQ").textContent = v.q;
    $("quizA").value = "";
    $("quizMsg").textContent = "";
    $("quizMsg").className = "";
    $("qHint").style.display = v.hint ? "" : "none";
    $("quizOverlay").classList.add("on");
    setTimeout(function () { $("quizA").focus(); }, 50);
  }

  function closeQuiz() {
    $("quizOverlay").classList.remove("on");
    quizVideo = null;
  }

  function checkAnswer() {
    if (!quizVideo) return;
    var v = quizVideo;
    var input = normAnswer($("quizA").value);
    if (!input) return;

    sha256Hex(input).then(function (h) {
      var ok = false;
      if (v.aHash && v.aHash.length) ok = v.aHash.indexOf(h) >= 0;
      if (!ok && v.a) {
        // 평문 정답(구버전 데이터)도 지원
        ok = String(v.a).split(",").map(normAnswer).filter(Boolean).indexOf(input) >= 0;
      }

      if (ok) {
        if (passed.indexOf(v.id) < 0) { passed.push(v.id); savePassed(); }
        $("quizMsg").className = "hint";
        $("quizMsg").textContent = "정답입니다! 영상을 재생합니다 🎉";
        setTimeout(function () { closeQuiz(); render(); openPlayer(v); }, 550);
      } else {
        tries++;
        $("quizBox").classList.remove("shake");
        void $("quizBox").offsetWidth;
        $("quizBox").classList.add("shake");
        $("quizMsg").className = "bad";
        $("quizMsg").textContent = "땡! 다시 생각해 보세요. (" + tries + "번째 시도)" +
          (tries >= 3 && v.hint ? " — 힌트 버튼을 눌러보세요." : "");
        $("quizA").select();
      }
    });
  }

  $("qSubmit").addEventListener("click", checkAnswer);
  $("quizA").addEventListener("keydown", function (e) { if (e.key === "Enter") checkAnswer(); });
  $("qCancel").addEventListener("click", closeQuiz);
  $("qHint").addEventListener("click", function () {
    if (!quizVideo || !quizVideo.hint) return;
    $("quizMsg").className = "hint";
    $("quizMsg").textContent = "💡 " + quizVideo.hint;
  });
  $("quizOverlay").addEventListener("click", function (e) { if (e.target === this) closeQuiz(); });

  // ---------- 재생 ----------
  function openPlayer(v) {
    if (isLocked(v)) { openQuiz(v); return; }
    $("playerFrame").src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1";
    $("pTitle").textContent = v.title;
    $("pYoutube").href = "https://www.youtube.com/watch?v=" + v.id;
    $("playerOverlay").classList.add("on");
  }
  function closePlayer() {
    $("playerOverlay").classList.remove("on");
    $("playerFrame").src = "about:blank";
  }
  $("pClose").addEventListener("click", closePlayer);
  $("playerOverlay").addEventListener("click", function (e) { if (e.target === this) closePlayer(); });

  // ---------- 수정 ----------
  var editIdx = -1;
  function openEdit(idx) {
    editIdx = idx;
    var v = videos[idx];
    $("eTitle").value = v.title;
    $("ePlace").value = v.place || "";
    $("eDate").value = v.tripDate || "";
    $("eMemo").value = v.memo || "";
    $("eQ").value = v.q || "";
    $("eHint").value = v.hint || "";
    // 저장된 정답은 해시라 되돌릴 수 없음 → 빈칸 + 안내
    $("eA").value = v.a || "";
    $("eA").placeholder = (v.aHash && v.aHash.length)
      ? "정답 " + v.aHash.length + "개 저장됨 (바꿀 때만 새로 입력)"
      : "예: 마라탕, 마라샹궈";
    $("editOverlay").classList.add("on");
    $("ePlace").focus();
  }
  function closeEdit() { $("editOverlay").classList.remove("on"); }
  $("eSave").addEventListener("click", function () {
    if (editIdx < 0) return;
    var v = videos[editIdx];
    v.title = $("eTitle").value.trim() || v.title;
    v.place = $("ePlace").value.trim();
    v.tripDate = $("eDate").value;
    v.memo = $("eMemo").value.trim();

    var q = $("eQ").value.trim();
    var aRaw = $("eA").value.trim();
    var hint = $("eHint").value.trim();

    var finish = function () {
      // 질문이 지워지면 잠금 해제 상태 기록도 정리
      if (!hasQuiz(v)) {
        var pi = passed.indexOf(v.id);
        if (pi >= 0) { passed.splice(pi, 1); savePassed(); }
      }
      save(); closeEdit(); render();
    };

    if (!q) {
      delete v.q; delete v.aHash; delete v.a; delete v.hint;
      finish();
      return;
    }

    v.q = q;
    if (hint) v.hint = hint; else delete v.hint;

    if (aRaw) {
      hashAnswers(aRaw).then(function (hashes) {
        if (hashes.length) { v.aHash = hashes; delete v.a; }
        // 문제를 낸 사람은 굳이 자기 퀴즈를 다시 풀 필요 없음
        if (passed.indexOf(v.id) < 0) { passed.push(v.id); savePassed(); }
        finish();
      });
    } else {
      finish();
    }
  });
  $("eCancel").addEventListener("click", closeEdit);
  $("editOverlay").addEventListener("click", function (e) { if (e.target === this) closeEdit(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if ($("loginOverlay").classList.contains("on")) closeLogin();
    else if ($("editOverlay").classList.contains("on")) closeEdit();
    else if ($("quizOverlay").classList.contains("on")) closeQuiz();
    else if ($("playerOverlay").classList.contains("on")) closePlayer();
  });

  // ---------- 정렬·검색 ----------
  $("sortBtn").addEventListener("click", function () {
    sortNewest = !sortNewest;
    this.textContent = sortNewest ? "최신순" : "오래된순";
    render();
  });
  $("search").addEventListener("input", render);

  $("relockBtn").addEventListener("click", function () {
    if (!passed.length) { alert("지금 열려 있는 퀴즈 영상이 없습니다."); return; }
    if (confirm("풀었던 퀴즈 " + passed.length + "개를 다시 잠글까요?\n(다음에 재생하려면 정답을 다시 맞혀야 합니다)")) {
      passed = []; savePassed(); render();
    }
  });

  // ---------- 백업 ----------
  $("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(videos, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "travel-videos-backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw 0;
        videos = data.filter(function (v) { return v && v.id && v.title; });
        save(); render();
      } catch (e) { alert("백업 파일 형식이 올바르지 않습니다."); }
    };
    r.readAsText(f);
    this.value = "";
  });

  // ---------- 시작: 공용 목록 로드 후 렌더 ----------
  applyAdminUI();
  mergeLists();
  render(); // 우선 로컬 데이터로 표시
  fetch("videos.json?v=" + Date.now())
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (d) { if (Array.isArray(d)) sharedList = d; })
    .catch(function () {})
    .then(function () {
      mergeLists(); render();
      // ?export=1 로 열면 이 브라우저의 병합 목록을 URL 해시에 실어줌 (마이그레이션용, 서버로 전송되지 않음)
      if (location.search.indexOf("export=1") >= 0) {
        try {
          location.hash = "data=" + btoa(unescape(encodeURIComponent(JSON.stringify(videos))));
        } catch (e) {}
      }
      checkSync();
    });

  // 이 기기에만 있는 변경(새 영상·수정·퀴즈 추가)이 있으면 공용 반영 안내 배너 표시
  function checkSync() {
    var sharedJson = {};
    sharedList.forEach(function (s) { sharedJson[s.id] = JSON.stringify(s); });
    var changed = videos.filter(function (v) { return sharedJson[v.id] !== JSON.stringify(v); });
    $("syncCount").textContent = changed.length;
    // 실제 표시 여부는 CSS가 관리자일 때만 허용한다
    $("syncBanner").classList.toggle("show", changed.length > 0);
  }
  $("syncCopy").addEventListener("click", function () {
    var code = JSON.stringify(videos, null, 2);
    function ok() { $("syncMsg").textContent = "복사됨! 관리자에게 붙여넣어 주세요."; }
    function fail() { prompt("아래 코드를 전체 선택해 복사하세요", code); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(ok, fail);
    } else { fail(); }
  });
})();
</script>
</body>
</html>
